<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claude Token Star Preview</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #05070b; color: #d9e4ef; display: grid; min-height: 100vh; place-items: center; }
    main { width: min(1180px, 96vw); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin: 0 0 14px; }
    h1 { font: 600 20px/1.1 system-ui, sans-serif; margin: 0 0 4px; }
    p { color: #8091a5; font-size: 12px; margin: 0; }
    .readout { color: #b9d8ff; text-align: right; font-size: 12px; position: relative; }
    .usage-toggle { color: #eef8ff; background: #050a11ee; border-color: #456b91; font-weight: 700; }
    .usage-toggle:hover, .usage-toggle[aria-expanded="true"] { border-color: #b9e4ff; background: #0d1b29; }
    .usage-details { position: absolute; z-index: 3; right: 0; top: 38px; min-width: 260px; padding: 10px 12px; border: 1px solid #456b91; border-radius: 7px; background: #050a11f5; color: #dceeff; text-align: left; line-height: 1.55; box-shadow: 0 16px 40px #000c; white-space: pre; }
    .usage-details[hidden] { display: none; }
    .ok { color: #75d79c; }
    canvas { width: 100%; aspect-ratio: 16/9; background: #070b12; border: 1px solid #1d2a3a; border-radius: 12px; display: block; box-shadow: 0 24px 80px #000a; cursor: grab; touch-action: none; }
    canvas.dragging { cursor: grabbing; }
    .controls { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; margin-top: 14px; }
    input { width: 100%; accent-color: #7db7ff; }
    button { background: #111b27; color: #d9e4ef; border: 1px solid #27384b; border-radius: 7px; padding: 7px 11px; font: inherit; cursor: pointer; }
    button:hover, button.active { border-color: #7db7ff; background: #16283b; }
    .stages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .stages button { color: #8fa5bb; font-size: 10px; padding: 5px 8px; }
    pre { white-space: pre-wrap; color: #ff7b72; font-size: 12px; }
    @media (max-width: 720px) { .controls { grid-template-columns: 1fr auto; } .controls input { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Claude Token Star</h1>
        <p>Current Windows overlay visuals — choose a stage or drag the star.</p>
      </div>
      <div class="readout">
        <button class="usage-toggle" id="usage-toggle" type="button" aria-expanded="false">
          <span id="mass">MASS 164K / 200K</span> | 5H 61% | 2h 23m <span id="usage-arrow">&#x25BC;</span>
        </button>
        <div class="usage-details" id="usage-details" hidden>CONTEXT 82%
Total input       164,000
Fresh input        42,000
Cache creation     51,000
Cache read         71,000
Last output         3,210
Remaining          36,000

5-hour limit          61%
Resets in          2h 23m
7-day limit           28%</div>
        <div><span id="stage">82% · NEUTRON STAR</span> · <span id="renderer">STARTING...</span></div>
      </div>
    </header>
    <canvas id="view" width="1280" height="720"></canvas>
    <div class="controls">
      <input id="level" aria-label="Token fill" type="range" min="0" max="100" value="82">
      <button id="tour" type="button">Auto tour</button>
      <button id="capture" type="button">Save PNG</button>
      <button id="reset-position" type="button">Auto position</button>
    </div>
    <div class="stages" id="stages" aria-label="Stage checkpoints"></div>
    <pre id="error"></pre>
  </main>
  <script type="module" src="./preview-renderer.js"></script>
</body>
</html>
