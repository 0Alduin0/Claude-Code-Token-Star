name: test

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src/ghostty/token-mass.py tests

  shader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  windows-terminal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - shell: powershell
        run: |
          try {
            .\tests\test-windows.ps1
          }
          catch {
            $message = $_.Exception.Message.Replace("`r", " ").Replace("`n", " ")
            Write-Output "::error title=Windows integration test::$message"
            throw
          }
      - shell: powershell
        run: .\tests\compile-hlsl.ps1
