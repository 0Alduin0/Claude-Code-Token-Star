name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm 11.5.1+; Node 22 bundles npm 10.
      - name: Update npm
        run: npm install --global npm@11
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
      - name: Build npm tarball
        run: npm pack
      # Publish before creating the GitHub release so a failed publish never
      # leaves a release that points users at an unavailable npm version.
      # npm authenticates through this workflow's trusted publisher (OIDC), so
      # no token secret is involved. Re-runs skip versions already on npm; the
      # check reads the public registry directly because setup-node configures
      # a placeholder token that can make `npm view` fail.
      - name: Publish to npm
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if curl -fs -o /dev/null "https://registry.npmjs.org/${PACKAGE}/${VERSION}"; then
            echo "${PACKAGE}@${VERSION} is already published; skipping."
            exit 0
          fi
          npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          ./claude-token-star-*.tgz
          --generate-notes
          --title "Claude Code Token Star ${GITHUB_REF_NAME}"
          --verify-tag
